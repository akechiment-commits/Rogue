<!DOCTYPE html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>立ち絵エディタ — Rogue</title>
    <link rel="stylesheet" href="/tools/portrait-editor.css" />
  </head>
  <body>
    <header>
      <div>
        <h1>立ち絵エディタ</h1>
        <p>各状況に画像をドロップ → 透過保存。<strong>+ 欄</strong> でバリエーション追加。防具着替え・転倒・店の追加欄は <code>portrait-extra-slots.json</code> と連動。</p>
      </div>
      <div class="stats">
        <button type="button" id="btn-batch-transparent" class="toolbar-btn">既存を一括透過</button>
        <span class="stat">配置済 <strong id="stat-filled">0</strong> / <strong id="stat-total">0</strong></span>
        <span class="stat"><a href="/" style="color: var(--accent); text-decoration: none;">← ゲームへ</a></span>
      </div>
    </header>
    <main id="main">
      <p class="empty-note">読み込み中…</p>
    </main>
    <div id="preview-modal" class="preview-modal" hidden>
      <div class="preview-dialog" role="dialog" aria-modal="true" aria-labelledby="preview-title">
        <div class="preview-dialog-head">
          <div>
            <h2 id="preview-title">立ち絵プレビュー</h2>
            <p id="preview-file" class="preview-file"></p>
          </div>
          <button type="button" id="preview-close" class="preview-close" aria-label="プレビューを閉じる">閉じる</button>
        </div>
        <div class="preview-canvas">
          <img id="preview-image" alt="" />
        </div>
      </div>
    </div>
    <div id="toast"></div>
    <script type="module" src="/tools/portrait-editor.js"></script>
  </body>
</html>
