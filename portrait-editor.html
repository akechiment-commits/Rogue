<!DOCTYPE html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>立ち絵エディタ — Rogue</title>
    <link rel="stylesheet" href="/tools/portrait-editor.css" />
  </head>
  <body>
    <header>
      <div>
        <h1>立ち絵エディタ</h1>
        <p>各状況に画像をドロップ → 白・緑背景を透過して <code>tiles/Character/名前.png</code> に保存</p>
      </div>
      <div class="stats">
        <button type="button" id="btn-batch-transparent" class="toolbar-btn">既存を一括透過</button>
        <span class="stat">配置済 <strong id="stat-filled">0</strong> / <strong id="stat-total">0</strong></span>
        <span class="stat"><a href="/" style="color: var(--accent); text-decoration: none;">← ゲームへ</a></span>
      </div>
    </header>
    <main id="main">
      <p class="empty-note">読み込み中…</p>
    </main>
    <div id="toast"></div>
    <script type="module" src="/tools/portrait-editor.js"></script>
  </body>
</html>
